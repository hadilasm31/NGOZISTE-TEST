<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Ngozistes du Royaume</title>
    <meta name="description" content="Connectez-vous à votre espace membre">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/favicon.ico">
    
    <!-- Configuration Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --dark-color: #010101;
            --light-color: #f4f4f4;
            --danger-color: #f44336;
            --success-color: #4CAF50;
            --text-color: #666;
            --border-radius: 8px;
            --box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            height: 70px;
            margin-bottom: 10px;
        }
        .logo-ngozistes { color: #ff0000; font-size: 1.5rem; font-weight: bold; }
        .logo-royaume { color: #000000; font-size: 1.5rem; font-weight: bold; }
        h1 {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .subtitle {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 30px;
        }
        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            text-align: center;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .alert.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .alert.info { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--dark-color);
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-input-wrapper input { padding-right: 45px; }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-color);
            font-size: 1.2rem;
            transition: var(--transition);
        }
        .toggle-password:hover { color: var(--primary-color); }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }
        .forgot-password {
            color: var(--secondary-color);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .forgot-password:hover {
            text-decoration: underline;
            color: var(--primary-color);
        }
        .btn-login-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-login-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }
        .btn-login-submit:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        .btn-login-submit i { margin-right: 8px; }
        .fa-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            transition: var(--transition);
        }
        .register-link a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            10%,30%,50%,70%,90%{transform:translateX(-5px)}
            20%,40%,60%,80%{transform:translateX(5px)}
        }
        .shake { animation: shake 0.5s ease-in-out; }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @media screen and (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            h1 { font-size: 1.8rem; }
            .form-options { flex-direction: column; gap: 10px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="images/logo/logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/70x70?text=Logo'">
            <div>
                <span class="logo-ngozistes">Ngozistes</span>
                <span class="logo-royaume">du Royaume</span>
            </div>
        </div>

        <h1>Connexion</h1>
        <p class="subtitle">Accédez à votre espace</p>
        
        <div class="alert" id="login-alert"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="exemple@email.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" required placeholder="********" autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Se souvenir de moi</label>
                </div>
                <a href="#" class="forgot-password" id="forgotPassword">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="btn-login-submit" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Se connecter
            </button>

            <div class="register-link">
                Pas encore membre ? <a href="adhesion.html">Adhérez maintenant</a>
            </div>
        </form>
    </div>

    <script>
        // =====================================================
        // PAGE DE CONNEXION - Script corrigé
        // =====================================================
        
        document.addEventListener('DOMContentLoaded', function() {
            initLoginPage();
        });

        function initLoginPage() {
            // Éléments du DOM
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('login-btn');
            const alertDiv = document.getElementById('login-alert');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const forgotPasswordLink = document.getElementById('forgotPassword');
            const rememberCheckbox = document.getElementById('remember');

            // Vérifier si déjà connecté
            checkCurrentUser();

            // Gestion du formulaire
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }

            // Afficher/masquer mot de passe
            if (togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', togglePasswordVisibility);
            }

            // Mot de passe oublié
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', handleForgotPassword);
            }

            // Email mémorisé
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail && emailInput) {
                emailInput.value = rememberedEmail;
                if (rememberCheckbox) rememberCheckbox.checked = true;
            }
        }

        async function checkCurrentUser() {
            try {
                const result = await window.getCurrentUser();
                
                if (result.user) {
                    showAlert('Vous êtes déjà connecté. Redirection...', 'info');
                    
                    setTimeout(() => {
                        if (result.user.role === 'super_admin' || result.user.role === 'admin') {
                            window.location.href = 'admin/dashboard.html';
                        } else if (result.user.role === 'member') {
                            window.location.href = 'member/dashboard.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1500);
                }
            } catch (error) {
                console.error('Erreur vérification:', error);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const alertDiv = document.getElementById('login-alert');
            const rememberCheckbox = document.getElementById('remember');
            
            // Validation
            if (!email || !password) {
                showAlert('Veuillez remplir tous les champs', 'error');
                return;
            }
            
            if (!validateEmail(email)) {
                showAlert('Adresse email invalide', 'error');
                return;
            }
            
            // Réinitialiser
            if (alertDiv) {
                alertDiv.style.display = 'none';
                alertDiv.className = 'alert';
            }
            
            // Désactiver le bouton
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading-spinner"></span> Connexion...';
            }
            
            try {
                const result = await window.login(email, password);
                
                if (result.success) {
                    // Sauvegarder l'email si demandé
                    if (rememberCheckbox && rememberCheckbox.checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    // Sauvegarder l'utilisateur pour synchro
                    localStorage.setItem('currentUser', JSON.stringify({
                        id: result.user.id,
                        nom: result.user.nom,
                        prenom: result.user.prenom,
                        email: result.user.email,
                        role: result.user.role,
                        photo: result.user.photo
                    }));
                    
                    showAlert('Connexion réussie ! Redirection...', 'success');
                    
                    // Rediriger selon le rôle
                    setTimeout(() => {
                        if (result.user.role === 'super_admin' || result.user.role === 'admin') {
                            window.location.href = 'admin/dashboard.html';
                        } else if (result.user.role === 'member') {
                            window.location.href = 'member/dashboard.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1500);
                } else {
                    showAlert(result.message || 'Email ou mot de passe incorrect', 'error');
                    
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                    }
                    
                    const loginContainer = document.querySelector('.login-container');
                    if (loginContainer) {
                        loginContainer.classList.add('shake');
                        setTimeout(() => {
                            loginContainer.classList.remove('shake');
                        }, 500);
                    }
                }
            } catch (error) {
                console.error('Erreur:', error);
                showAlert('Une erreur est survenue. Veuillez réessayer.', 'error');
                
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                }
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            
            if (!passwordInput || !toggleIcon) return;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            const email = prompt('Entrez votre adresse email pour réinitialiser votre mot de passe :');
            
            if (email) {
                if (!validateEmail(email)) {
                    showAlert('Email invalide', 'error');
                    return;
                }
                showAlert('Fonctionnalité en cours de développement. Contactez l\'administrateur.', 'info');
            }
        }

        function showAlert(message, type) {
            const alertDiv = document.getElementById('login-alert');
            if (!alertDiv) return;
            
            alertDiv.textContent = message;
            alertDiv.className = `alert ${type}`;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                if (alertDiv.style.display === 'block') {
                    alertDiv.style.display = 'none';
                }
            }, type === 'error' ? 5000 : 3000);
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
    </script>
</body>
</html>
